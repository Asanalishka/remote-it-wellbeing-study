name: Pilot verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned environment and run unit tests
        run: docker build -t remote-it-wellbeing-study .
      - name: Run pilot and preserve output on host
        run: |
          mkdir -p results
          docker run --rm --mount "type=bind,source=$(pwd)/results,target=/app/results" remote-it-wellbeing-study
      - name: Check persisted pilot result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/pilot_summary.json").read_text())
          assert result["n_input"] == result["n_valid"] == 8, result
          assert result["n_rejected"] == 0, result
          assert result["quality_pass"] is True, result
          assert result["primary_model"]["status"] == "not_estimated", result
          assert set(result["descriptive"]) == {"pss_score", "cbi_work_score", "productivity_0_10", "remote_work_percent"}, result
          assert result["descriptive"]["remote_work_percent"] == 78.438, result
          print("Persisted pilot JSON verified: 8 valid synthetic responses; no inference.")
          PY
