name: Pilot verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up study Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-studio.txt
      - name: Install pinned studio dependencies
        run: python -m pip install -r requirements-studio.txt
      - name: Test legacy compatibility and studio statistics and figures
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/studio -v
      - name: Generate synthetic tables and headless figures
        run: |
          python -m src.process_data
          python -m src.visualize
      - name: Verify generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from PIL import Image
          report = json.loads(Path("data/processed/quality_report.json").read_text())
          assert report["processing_status"] == "complete"
          assert report["n_input"] == report["n_valid"] == 8
          assert report["n_rejected"] == 0 and report["quality_pass"]
          assert report["synthetic_demo"] is True
          assert report["primary_model"]["status"] == "not_estimated"
          assert len(pd.read_csv("data/processed/metrics_summary.csv")) == 3
          for stem in ("means_ci", "distributions", "burnout_productivity"):
              assert Path(f"reports/figures/{stem}.pdf").read_bytes().startswith(b"%PDF-")
              with Image.open(f"reports/figures/{stem}.png") as image:
                  assert abs(image.info["dpi"][0] - 300) < 0.1
          print("Synthetic studio verified: three summary rows and six figure files.")
          PY
  docker-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned environment and run unit tests
        run: docker build -t remote-it-wellbeing-study .
      - name: Run pilot and preserve output on host
        run: |
          mkdir -p results
          docker run --rm --mount "type=bind,source=$(pwd)/results,target=/app/results" remote-it-wellbeing-study
      - name: Check persisted pilot result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/pilot_summary.json").read_text())
          assert result["n_input"] == result["n_valid"] == 8, result
          assert result["n_rejected"] == 0, result
          assert result["quality_pass"] is True, result
          assert result["primary_model"]["status"] == "not_estimated", result
          assert set(result["descriptive"]) == {"pss_score", "cbi_work_score", "productivity_0_10", "remote_work_percent"}, result
          assert result["descriptive"]["remote_work_percent"] == 78.438, result
          print("Persisted pilot JSON verified: 8 valid synthetic responses; no inference.")
          PY
